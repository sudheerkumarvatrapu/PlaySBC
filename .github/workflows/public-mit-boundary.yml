name: Public MIT boundary

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Keep public repository on v3.0.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce public source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "3.0.0"
          test "$(awk '$1 == "version:" {print $2; exit}' charts/playsbc/Chart.yaml)" = "3.0.0"
          test "$(awk '$1 == "appVersion:" {gsub(/\"/, "", $2); print $2; exit}' charts/playsbc/Chart.yaml)" = "3.0.0"
          grep -q '^MIT License$' LICENSE
          test ! -f LICENSE-MIT
          test ! -f PROVENANCE.md
          test ! -f docs/COMMERCIAL_DEVELOPMENT.md
          test ! -f configs/kubernetes/commercial-registry-values.yaml
          ! grep -q -- '-commercial' .github/workflows/container-images.yml
