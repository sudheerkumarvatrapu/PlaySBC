name: Rebuild public v3.0.0 container images

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: Public release version; must match VERSION
        required: true
        type: string

permissions:
  contents: read

jobs:
  policy:
    name: Verify requested public release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.policy.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require the repository version
        id: policy
        env:
          REQUESTED_VERSION: ${{ inputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          requested="${REQUESTED_VERSION#v}"
          test "$version" = "3.0.0"
          test "$requested" = "3.0.0"
          test "$(awk '$1 == "version:" {print $2; exit}' charts/playsbc/Chart.yaml)" = "3.0.0"
          test "$(awk '$1 == "appVersion:" {gsub(/\"/, "", $2); print $2; exit}' charts/playsbc/Chart.yaml)" = "3.0.0"
          grep -q '^MIT License$' LICENSE
          echo "version=3.0.0" >> "$GITHUB_OUTPUT"

  publish:
    name: Rebuild public ${{ matrix.image }}
    needs: policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: playsbc
            dockerfile: docker/playsbc.Dockerfile
          - image: playsbc-rtpengine
            dockerfile: docker/rtpengine.Dockerfile
          - image: playsbc-k8s-regression
            dockerfile: docker/k8s-regression-runner.Dockerfile
          - image: playsbc-sipp
            dockerfile: docker/sipp.Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.policy.outputs.version }}
            type=raw,value=3.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
