{{- $rasa := .Values.rasa | default dict -}}
{{- $rasaEnabled := get $rasa "enabled" | default false -}}
{{- if $rasaEnabled }}
{{- $image := get $rasa "image" | default dict -}}
{{- $project := get $rasa "project" | default dict -}}
{{- $servicePort := get $rasa "servicePort" | default 5005 -}}
{{- $evidencePort := get $rasa "evidencePort" | default 5006 -}}
{{- $trainOnStart := true -}}
{{- if hasKey $rasa "trainOnStart" -}}
{{- $trainOnStart = get $rasa "trainOnStart" -}}
{{- end -}}
{{- $resources := get $rasa "resources" | default dict -}}
{{- $startupProbe := get $rasa "startupProbe" | default dict -}}
{{- $readinessProbe := get $rasa "readinessProbe" | default dict -}}
{{- $livenessProbe := get $rasa "livenessProbe" | default dict -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "playsbc.fullname" . }}-rasa-project
  labels:
{{ include "playsbc.labels" . | indent 4 }}
data:
  config.yml: |
{{ get $project "config" | default "" | indent 4 }}
  domain.yml: |
{{ get $project "domain" | default "" | indent 4 }}
  nlu.yml: |
{{ get $project "nlu" | default "" | indent 4 }}
  rules.yml: |
{{ get $project "rules" | default "" | indent 4 }}
  credentials.yml: |
{{ get $project "credentials" | default "rest:\n" | indent 4 }}
  endpoints.yml: |
{{ get $project "endpoints" | default "action_endpoint:\n  url: \"\"\n" | indent 4 }}
  evidence_proxy.py: |
    import http.client, json, time
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    class Handler(BaseHTTPRequestHandler):
        def _proxy(self):
            started=time.monotonic(); length=int(self.headers.get("Content-Length", "0")); body=self.rfile.read(length)
            conn=http.client.HTTPConnection("127.0.0.1", {{ $servicePort }}, timeout=30)
            headers={k:v for k,v in self.headers.items() if k.lower() not in {"host","connection","content-length"}}
            headers["Content-Length"]=str(len(body)); conn.request(self.command,self.path,body=body,headers=headers)
            response=conn.getresponse(); data=response.read(); self.send_response(response.status)
            for key,value in response.getheaders():
                if key.lower() not in {"connection","transfer-encoding","content-length"}: self.send_header(key,value)
            self.send_header("Content-Length",str(len(data))); self.end_headers(); self.wfile.write(data)
            try: call_id=str(json.loads(body or b"{}").get("sender", ""))[:256]
            except Exception: call_id=""
            print(json.dumps({"timestamp":datetime.now(timezone.utc).isoformat(),"event":"rasa.http.completed","call_id":call_id,"method":self.command,"path":self.path,"status":response.status,"request_bytes":len(body),"response_bytes":len(data),"duration_ms":round((time.monotonic()-started)*1000,3)},separators=(",",":")),flush=True)
        do_GET=_proxy; do_POST=_proxy
        def log_message(self,*args): pass
    ThreadingHTTPServer(("0.0.0.0", {{ $evidencePort }}),Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "playsbc.fullname" . }}-rasa
  labels:
{{ include "playsbc.labels" . | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "playsbc.name" . }}-rasa
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/rasa-project: {{ toJson $project | sha256sum | quote }}
      labels:
        app.kubernetes.io/name: {{ include "playsbc.name" . }}-rasa
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: rasa
          image: "{{ get $image "repository" | default "rasa/rasa" }}:{{ get $image "tag" | default "3.6.20-full" }}"
          imagePullPolicy: {{ get $image "pullPolicy" | default "IfNotPresent" }}
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              set -eu
              rm -rf /tmp/playsbc-rasa-lab
              mkdir -p /tmp/playsbc-rasa-lab/data
              cp /project/config.yml /tmp/playsbc-rasa-lab/config.yml
              cp /project/domain.yml /tmp/playsbc-rasa-lab/domain.yml
              cp /project/credentials.yml /tmp/playsbc-rasa-lab/credentials.yml
              cp /project/endpoints.yml /tmp/playsbc-rasa-lab/endpoints.yml
              cp /project/nlu.yml /tmp/playsbc-rasa-lab/data/nlu.yml
              cp /project/rules.yml /tmp/playsbc-rasa-lab/data/rules.yml
              cd /tmp/playsbc-rasa-lab
              MODEL_ARGS=""
              if [ "{{ $trainOnStart }}" = "true" ]; then
                rasa train --config config.yml --domain domain.yml --data data --out /tmp/playsbc-rasa-models
                MODEL_ARGS="--model /tmp/playsbc-rasa-models"
              fi
              exec rasa run --enable-api --cors "*" -i 0.0.0.0 --port {{ $servicePort }} ${MODEL_ARGS} --credentials credentials.yml --endpoints endpoints.yml
          ports:
            - name: http
              containerPort: {{ $servicePort }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ get $startupProbe "initialDelaySeconds" | default 10 }}
            periodSeconds: {{ get $startupProbe "periodSeconds" | default 5 }}
            timeoutSeconds: {{ get $startupProbe "timeoutSeconds" | default 5 }}
            failureThreshold: {{ get $startupProbe "failureThreshold" | default 120 }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ get $readinessProbe "initialDelaySeconds" | default 5 }}
            periodSeconds: {{ get $readinessProbe "periodSeconds" | default 5 }}
            timeoutSeconds: {{ get $readinessProbe "timeoutSeconds" | default 5 }}
            failureThreshold: {{ get $readinessProbe "failureThreshold" | default 6 }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ get $livenessProbe "initialDelaySeconds" | default 30 }}
            periodSeconds: {{ get $livenessProbe "periodSeconds" | default 10 }}
            timeoutSeconds: {{ get $livenessProbe "timeoutSeconds" | default 5 }}
            failureThreshold: {{ get $livenessProbe "failureThreshold" | default 6 }}
          volumeMounts:
            - name: project
              mountPath: /project
              readOnly: true
          resources:
{{ toYaml $resources | indent 12 }}
        - name: rasa-evidence-proxy
          image: "{{ get $image "repository" | default "rasa/rasa" }}:{{ get $image "tag" | default "3.6.20-full" }}"
          imagePullPolicy: {{ get $image "pullPolicy" | default "IfNotPresent" }}
          command: ["python", "/project/evidence_proxy.py"]
          ports:
            - name: evidence-http
              containerPort: {{ $evidencePort }}
              protocol: TCP
          readinessProbe:
            tcpSocket: {port: evidence-http}
          volumeMounts:
            - name: project
              mountPath: /project
              readOnly: true
      volumes:
        - name: project
          configMap:
            name: {{ include "playsbc.fullname" . }}-rasa-project
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "playsbc.fullname" . }}-rasa
  labels:
{{ include "playsbc.labels" . | indent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "playsbc.name" . }}-rasa
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ $servicePort }}
      targetPort: evidence-http
      protocol: TCP
{{- end }}
