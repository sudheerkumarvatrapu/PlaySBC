{{- $cloud := .Values.cloud | default dict -}}
{{- $azure := get $cloud "azure" | default dict -}}
{{- $media := get $azure "media" | default dict -}}
{{- $mediaPublic := get $media "public" | default dict -}}
{{- $portRange := get $mediaPublic "portRange" | default dict -}}
{{- if and (get $azure "enabled") (get $mediaPublic "enabled") -}}
{{- if not (get $portRange "enabled" | default false) -}}
{{- fail "Azure public RTP media requires cloud.azure.media.public.portRange.enabled=true for the locked PlaySBC real-device baseline." -}}
{{- end -}}

{{- $rangeMin := int (get $portRange "min" | default 30000) -}}
{{- $rangeMax := int (get $portRange "max" | default 30049) -}}
{{- $rtpMin := int .Values.rtpengine.rtpMin -}}
{{- $rtpMax := int .Values.rtpengine.rtpMax -}}
{{- if or (ne $rangeMin 30000) (ne $rangeMax 30049) -}}
{{- fail (printf "Azure public RTP media must expose exactly UDP 30000-30049; got %d-%d." $rangeMin $rangeMax) -}}
{{- end -}}
{{- if or (ne $rtpMin $rangeMin) (ne $rtpMax $rangeMax) -}}
{{- fail (printf "RTPengine range %d-%d must match Azure public RTP LoadBalancer range %d-%d." $rtpMin $rtpMax $rangeMin $rangeMax) -}}
{{- end -}}
{{- $advertisedIP := get .Values.rtpengine "advertisedIP" | default "" -}}
{{- if eq $advertisedIP "" -}}
{{- fail "Azure public RTP media requires rtpengine.advertisedIP to equal the allocated RTP public LoadBalancer IP." -}}
{{- end -}}
{{- $publicIPv4 := get $mediaPublic "publicIPv4" | default "" -}}
{{- if and $publicIPv4 (ne $advertisedIP $publicIPv4) -}}
{{- fail (printf "rtpengine.advertisedIP (%s) must match cloud.azure.media.public.publicIPv4 (%s)." $advertisedIP $publicIPv4) -}}
{{- end -}}
{{- end -}}

{{- $localRealDevice := .Values.localRealDevice | default dict -}}
{{- if (get $localRealDevice "enabled" | default false) -}}
{{- $lanIPv4 := get $localRealDevice "lanIPv4" | default "" -}}
{{- if eq $lanIPv4 "" -}}
{{- fail "The kind real-device profile requires localRealDevice.lanIPv4 to be the Mac LAN IPv4 address." -}}
{{- end -}}
{{- if (get $azure "enabled" | default false) -}}
{{- fail "The kind real-device profile cannot enable Azure cloud exposure." -}}
{{- end -}}
{{- $activeActive := .Values.topology.activeActive -}}
{{- if or (not $activeActive.enabled) (not $activeActive.useStatefulSet) -}}
{{- fail "The kind real-device profile requires active-active StatefulSets." -}}
{{- end -}}
{{- if or (ne (int $activeActive.playsbcReplicas) 2) (ne (int $activeActive.rtpengineReplicas) 2) -}}
{{- fail "The kind real-device profile requires two PlaySBC and two RTPengine replicas." -}}
{{- end -}}
{{- if or .Values.hostNetwork (not .Values.rtpengine.hostNetwork) -}}
{{- fail "The kind real-device profile requires pod-networked PlaySBC and host-networked RTPengine with split ports." -}}
{{- end -}}
{{- $nodePorts := get .Values.service "nodePorts" | default dict -}}
{{- if or (ne .Values.service.type "NodePort") (ne (int (get $nodePorts "sip" | default 0)) 32062) (ne (int (get $nodePorts "tls" | default 0)) 32061) -}}
{{- fail "The kind real-device profile requires SIP NodePort 32062 and TLS NodePort 32061." -}}
{{- end -}}
{{- if or (ne (int .Values.rtpengine.rtpMin) 30000) (ne (int .Values.rtpengine.rtpMax) 30049) -}}
{{- fail "The kind real-device profile requires the mapped RTP range 30000-30049/UDP." -}}
{{- end -}}
{{- $config := .Values.playsbc.config | default dict -}}
{{- if or (ne (get $config "sip_advertised_ip" | default "") $lanIPv4) (ne (get $config "b2bua_advertised_ip" | default "") $lanIPv4) -}}
{{- fail "The kind real-device PlaySBC advertised SIP addresses must equal localRealDevice.lanIPv4." -}}
{{- end -}}
{{- if ne (.Values.rtpengine.advertisedIP | default "") $lanIPv4 -}}
{{- fail "The kind real-device RTPengine advertisedIP must equal localRealDevice.lanIPv4." -}}
{{- end -}}
{{- end -}}
